# Treat these as success even if unreachable from CI.
exclude = [
  "^/",          # root-absolute links (e.g. /favicon.svg) — correctness depends on the
                 # deployment base (project path today, subdomain root after migration),
                 # not on repo layout, so don't filesystem-check them here.
  "^file://",
  "^mailto:",
  # legislature.mi.gov serves a cert chain that lychee's rustls client rejects as
  # UnknownIssuer, while curl/browsers (system CA bundle) trust it fine (verified
  # HTTP 200, ssl_verify_result=0). These are stable statutory permalinks lychee
  # cannot check reliably, so exclude the host rather than fail CI on a TLS quirk.
  'legislature\.mi\.gov',
]

exclude_path = []

max_retries = 2
retry_wait_time = 2
timeout = 20

# Accept these status codes as OK (some sites 403/429 bots).
accept = ["200..=299", "403", "429"]
